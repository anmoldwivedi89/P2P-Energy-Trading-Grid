<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 220 240" fill="none" role="img" aria-label="GRID P2P Clean Energy Trading">
  <defs>
    <style>
      :root {
        --grid-outline: #F5E8D8;
        --grid-green: #4ADE80;
        --grid-green-deep: #22C55E;
        --grid-gold: #FDE047;
        --grid-gold-deep: #DAA520;
        --grid-panel-bg: #242424;
        --grid-sub: #B5A898;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --grid-outline: #292824;
          --grid-green: #6B8F71;
          --grid-green-deep: #557B5B;
          --grid-gold: #DAA520;
          --grid-gold-deep: #C69115;
          --grid-panel-bg: #F0E8DE;
          --grid-sub: #77736B;
        }
      }
      .eco-leaf { fill: url(#static-leaf-grad); }
      .eco-stroke { stroke: var(--grid-green); }
      .eco-vein { stroke: var(--grid-green-deep); }
      .grid-outline { stroke: var(--grid-outline); }
      .grid-wire { stroke: var(--grid-green); }
      .grid-window { fill: var(--grid-gold); }
      .grid-panel { fill: var(--grid-panel-bg); stroke: var(--grid-outline); }
      .bolt-fill { fill: url(#static-bolt-grad); stroke: var(--grid-outline); }
      .wordmark-pri { fill: var(--grid-outline); }
      .wordmark-acc { fill: var(--grid-green); }
      .wordmark-sub { fill: var(--grid-sub); }
    </style>

    <linearGradient id="static-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="static-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
  </defs>

  <!-- Circular microgrid boundary arcs -->
  <path d="M 28,124 C 22,146 44,166 100,166 C 156,166 178,146 172,124" class="eco-stroke" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 124,28 C 148,32 168,54 165,82" class="eco-stroke" stroke-width="4.5" stroke-linecap="round" />

  <!-- Upper-left stylized renewable leaf canopy -->
  <path d="M 35,82 C 36,52 62,28 102,26 C 122,25 130,30 134,34 C 116,45 92,54 74,62 C 60,68 45,74 35,82 Z" class="eco-leaf" />
  <path d="M 35,82 C 36,52 62,28 102,26 C 122,25 130,30 134,34 C 116,45 92,54 74,62 C 60,68 45,74 35,82" class="eco-stroke" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 54,64 C 76,50 102,40 126,33" class="eco-vein" stroke-width="2.4" stroke-linecap="round" />

  <!-- Left House (Prosumer Node) -->
  <path d="M 20,102 L 45,80 L 70,102" class="grid-outline" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 28,102 L 28,124 L 62,124 L 62,102" class="grid-outline" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="36" y="106" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="47" y="106" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="36" y="114" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="47" y="114" width="6.5" height="5.5" rx="1" class="grid-window" />

  <!-- Right House (Consumer Node) -->
  <path d="M 130,102 L 155,80 L 180,102" class="grid-outline" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 138,102 L 138,124 L 172,124 L 172,102" class="grid-outline" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="146" y="106" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="157" y="106" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="146" y="114" width="6.5" height="5.5" rx="1" class="grid-window" />
  <rect x="157" y="114" width="6.5" height="5.5" rx="1" class="grid-window" />

  <!-- Microgrid P2P transmission lines -->
  <path d="M 62,118 C 70,118 64,132 72,132" class="grid-wire" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 128,132 C 136,132 130,118 138,118" class="grid-wire" stroke-width="3.2" stroke-linecap="round" />

  <!-- Central perspective solar PV panel -->
  <path d="M 100,142 L 100,154" class="grid-outline" stroke-width="4" stroke-linecap="round" />
  <path d="M 93,154 L 107,154" class="grid-outline" stroke-width="3" stroke-linecap="round" />
  <polygon points="76,114 124,114 132,142 68,142" class="grid-panel" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="72" y1="128" x2="128" y2="128" class="grid-outline" stroke-width="2.4" />
  <line x1="92" y1="114" x2="89" y2="142" class="grid-outline" stroke-width="2.4" />
  <line x1="108" y1="114" x2="111" y2="142" class="grid-outline" stroke-width="2.4" />

  <!-- Central Electric Lightning Bolt -->
  <polygon points="108,36 85,74 101,74 93,106 121,66 104,66" class="bolt-fill" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Full Wordmark: GRID P2P ENERGY TRADING -->
  <g>
    <text x="110" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="0.5">
      <tspan class="wordmark-pri">GRID </tspan>
      <tspan class="wordmark-acc" font-weight="700">P2P</tspan>
    </text>
    <line x1="32" y1="216" x2="56" y2="216" class="eco-stroke" stroke-width="1.8" stroke-linecap="round" />
    <text x="110" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="3" class="wordmark-sub">
      ENERGY TRADING
    </text>
    <line x1="164" y1="216" x2="188" y2="216" class="eco-stroke" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
